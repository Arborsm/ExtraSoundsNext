modLoader = "javafml"
loaderVersion = "[2,)"
license = "${license}"
issueTrackerURL = "${issues_url}"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
displayURL = "${homepage_url}"
modUrl = "${homepage_url}"
logoFile = "assets/extrasounds/icon.png"
authors = "${authors}"
logoBlur = false
credits = "${contributors}"

description = '''${description}'''

[[mixins]]
config = "extrasounds.mixins.json"
${dependencies}
